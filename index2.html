
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahman Soltani</title>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
        :root {
            --bg-base: #040814;
            --bg-darker: #02040a;
            --bg-card: #091330;
            --glow-red: #DC3C3C;
            --glow-cyan: #2D91C3;
            --glow-light-cyan: #5DC1F3;
            --glow-blue: #1E5096;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 85% 30%, rgba(220, 60, 60, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 15% 60%, rgba(45, 145, 195, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(30, 80, 150, 0.2) 0%, transparent 70%);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(2, 4, 10, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(30, 80, 150, 0.3);
        }

        .nav-brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-menu-container {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 5px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(45, 145, 195, 0.1);
            color: var(--glow-cyan);
            box-shadow: inset 0 -3px 0 var(--glow-cyan);
        }

        .mobile-toggle {
            display: none;
            background: transparent;
            border: 1px solid var(--glow-cyan);
            color: var(--glow-cyan);
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .lang-switcher {
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--glow-blue);
            color: var(--text-muted);
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .lang-btn:hover {
            border-color: var(--glow-cyan);
            color: var(--glow-cyan);
        }

        .lang-btn.active {
            background: var(--glow-blue);
            color: #fff;
            border-color: var(--glow-blue);
        }

        .profile-banner {
            max-width: 1200px;
            margin: 40px auto 20px auto;
            padding: 30px;
            background: rgba(9, 19, 48, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(30, 80, 150, 0.3);
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            align-items: center;
            width: 90%;
        }

        .profile-info {
            flex: 1;
            min-width: 300px;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: var(--bg-card);
            border: 2px solid var(--glow-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--glow-cyan);
            box-shadow: 0 0 15px rgba(45, 145, 195, 0.3);
            flex-shrink: 0;
            overflow: hidden;
        }

        .profile-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-details h1 {
            color: var(--text-main);
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .profile-details p {
            color: var(--text-muted);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            flex-wrap: wrap;
        }

        .contact-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            color: var(--text-muted);
            flex-wrap: wrap;
        }
        
        .contact-info a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s ease;
            word-break: break-word;
        }
        
        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(30, 80, 150, 0.2);
            border: 1px solid var(--glow-blue);
            color: var(--text-main);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .social-btn:hover {
            background: rgba(45, 145, 195, 0.2);
            border-color: var(--glow-cyan);
            box-shadow: 0 0 10px rgba(45, 145, 195, 0.3);
            color: var(--glow-cyan);
        }

        .profile-stats {
            flex: 1;
            min-width: 300px;
            border-left: 1px solid rgba(30, 80, 150, 0.3);
            padding-left: 40px;
        }

        main {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            width: 90%;
        }

        .card {
            background: rgba(9, 19, 48, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(30, 80, 150, 0.3);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            height: 100%;
        }

        .card:hover {
            border-color: rgba(45, 145, 195, 0.5);
            box-shadow: 0 4px 20px rgba(45, 145, 195, 0.1);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(30, 80, 150, 0.3);
        }

        .icon-box {
            background: rgba(45, 145, 195, 0.1);
            color: var(--glow-cyan);
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            background: rgba(30, 80, 150, 0.2);
            border: 1px solid var(--glow-blue);
            color: var(--text-main);
            margin: 0 5px 5px 0;
        }
        
        .badge.cyan { color: var(--glow-cyan); border-color: var(--glow-cyan); background: rgba(45, 145, 195, 0.1); }
        .badge.red { color: var(--glow-red); border-color: var(--glow-red); background: rgba(220, 60, 60, 0.1); }
        .badge.blue { color: #8cb4ff; border-color: var(--glow-blue); background: rgba(30, 80, 150, 0.2); }

        .progress-container {
            margin-bottom: 15px;
        }
        
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--bg-darker);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--glow-cyan);
            border-radius: 3px;
            transition: width 1s ease;
        }

        .timeline {
            position: relative;
            padding-left: 30px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--glow-blue);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 30px;
        }

        .timeline-dot {
            position: absolute;
            left: -35px;
            top: 20px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--glow-cyan);
            z-index: 2;
        }

        .timeline-dot.first {
            background: var(--glow-cyan);
            box-shadow: 0 0 10px var(--glow-cyan);
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .timeline-title h5 { font-size: 1.2rem; color: var(--text-main); }
        .timeline-meta { font-size: 0.9rem; color: var(--text-muted); display: flex; gap: 10px; align-items: center; margin-top: 5px;}
        .timeline-meta a { color: var(--glow-cyan); text-decoration: none; }
        .timeline-meta a:hover { text-decoration: underline; }

        .timeline-list { list-style: none; margin-bottom: 15px;}
        .timeline-list li {
            position: relative;
            padding-left: 25px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }
        .timeline-list li i {
            position: absolute;
            left: 0;
            top: 4px;
            color: var(--glow-cyan);
            font-size: 0.8rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .edu-item { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(30, 80, 150, 0.2); }
        .edu-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .edu-item h6 { font-size: 1.1rem; margin-bottom: 5px; color: var(--text-main); }
        .edu-item a { color: var(--glow-cyan); text-decoration: none; }
        .edu-item .meta { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-top: 5px; }

        .footer {
            background: rgba(2, 4, 10, 0.9);
            border-top: 1px solid rgba(30, 80, 150, 0.3);
            text-align: center;
            padding: 25px;
            margin-top: 40px;
            color: var(--text-muted);
        }

        #loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-base);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--glow-cyan);
            font-size: 2rem;
            flex-direction: column;
            gap: 15px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(45, 145, 195, 0.3);
            border-top-color: var(--glow-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        .fadein { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 992px) {
            .mobile-toggle { display: block; }
            .nav-menu-container {
                display: none; 
                flex-direction: column; 
                position: absolute;
                top: 100%; left: 0; width: 100%; 
                background: rgba(2, 4, 10, 0.95);
                padding: 20px; 
                border-bottom: 1px solid rgba(30, 80, 150, 0.3);
                align-items: flex-start;
            }
            .nav-menu-container.show { display: flex; }
            .nav-menu { flex-direction: column; width: 100%; gap: 15px; }
            .nav-link { box-shadow: none !important; border-left: 3px solid transparent; border-radius: 0; padding: 10px; }
            .nav-link:hover, .nav-link.active { border-left-color: var(--glow-cyan); }
            
            .profile-stats {
                border-left: none;
                padding-left: 0;
                border-top: 1px solid rgba(30, 80, 150, 0.3);
                padding-top: 25px;
            }
            
            .profile-info {
                flex-direction: column;
                text-align: center;
                min-width: 100%;
            }

            .profile-details p, .contact-info {
                justify-content: center;
            }
            
            .profile-banner {
                padding: 20px;
                gap: 25px;
            }
        }
    </style>
    
    
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <span style="font-size: 1rem; color: var(--text-muted);">Loading...</span>
    </div>

    
    <nav class="navbar">
        <div class="nav-brand">
            <span style="color: var(--glow-cyan);">&lt;</span>Bahman Soltani<span style="color: var(--glow-red);">/&gt;</span>
        </div>
        
        <button class="mobile-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        
        <div class="nav-menu-container" id="nav-menu-container">
            <ul id="nav-links" class="nav-menu">
                
            </ul>

            <div class="lang-switcher">
                <button id="btn-en" class="lang-btn active" onclick="setLanguage('en')">EN</button>
                <button id="btn-de" class="lang-btn" onclick="setLanguage('de')">DE</button>
            </div>
        </div>
    </nav>

    <header class="profile-banner">
        <div class="profile-info">
            <div class="profile-img">
                <img src="https://vohuman.github.io/assets/Bild.jpg" alt="Profile Picture">
            </div>
            <div class="profile-details">
                <h1>Bahman Soltani</h1>
                <h3 id="title" style="margin-bottom: 10px; color: var(--glow-light-cyan);">Full Stack Developer</h3>
                <p><i class="fa-solid fa-location-dot" style="color: var(--glow-cyan)"></i> 27356 Rotenburg Wümme, <span id="germany">Germany</span></p>

                <div class="contact-info">
                    <i class="fa-solid fa-envelope" style="color: var(--glow-cyan)"></i>
                    <a href="mailto:bahman.soltani@gmail.com">bahman.soltani@gmail.com</a>
                </div>
                <div class="contact-info">
                    <i class="fa-solid fa-phone" style="color: var(--glow-cyan)"></i>
                    <a href="tel:+4917655568384">+4917655568384</a>
                </div>

                <div>
                    <a class="social-btn" target="_blank" href="https://www.linkedin.com/in/vohuman/">
                        <i class="fa-brands fa-linkedin"></i>
                        LinkedIn
                    </a>
                </div>
            </div>
        </div>
        <div class="profile-stats">
            <h4 id="lang" style="color: var(--text-main); margin-bottom: 15px; font-size: 1.1rem;">Languages</h4>
            <div id="langbar">
                <!-- JS dynamically injects languages here -->
            </div>
        </div>
    </header>


    <main class="intro">
        
    </main>

    
    <footer class="footer">
        <p>&copy; 2026 Bahman Soltani.</p>
        <div style="margin-top: 10px; display: flex; justify-content: center; gap: 15px;">
            <a href="#" style="color: var(--text-muted);"><i class="fa-brands fa-github"></i></a>
            <a href="mailto:bahman.soltani@gmail.com" style="color: var(--text-muted);"><i class="fa-brands fa-linkedin"></i></a>
            <a href="mailto:bahman.soltani@gmail.com" style="color: var(--text-muted);"><i class="fa-solid fa-envelope"></i></a>
        </div>
    </footer>

    <script>
        let currentLang = 'en';
        let changelanges = false;
        let resumeData = null;
        let isfirstload = true;

        const i18n = {
            en: {
                headers: {
                    intro: "Introduction",
                    languages: "Languages",
                    skills: "Technical Skills",
                    experience: "Employment History",
                    education: "Education",
                    certificates: "Certificates",
                    universities: "Universities"
                },
                labels: {
                    techStack: "Tech Stack",
                    contact: "Contact",
                    present: "Present"
                },
                nav: {
                    home: "Profile",
                    intro: "About",
                    history: "Experience",
                    skills: "Skills",
                    education: "Education"
                },
                categories: {
                    backend: "Backend",
                    frontend: "Frontend",
                    database: "Database",
                    sourceControl: "DevOps & Tools",
                    projectManagement: "Management",
                    general: "General"
                }
            },
            de: {
                headers: {
                    intro: "Einführung",
                    languages: "Sprachkenntnisse",
                    skills: "Technische Fähigkeiten",
                    experience: "Berufserfahrung",
                    education: "Ausbildung",
                    certificates: "Zertifikate",
                    universities: "Universitäten"
                },
                labels: {
                    techStack: "Technologien",
                    contact: "Kontakt",
                    present: "Aktuell"
                },
                nav: {
                    home: "Profil",
                    intro: "Über mich",
                    history: "Erfahrung",
                    skills: "Fähigkeiten",
                    education: "Ausbildung"
                },
                categories: {
                    backend: "Backend",
                    frontend: "Frontend",
                    database: "Datenbank",
                    sourceControl: "DevOps & Tools",
                    projectManagement: "Management",
                    general: "Allgemein"
                }
            }
        };

        function load() {
             $('#loading').show();
            if (resumeData == null) {
                $.ajax({
                    url: 'https://vohuman.github.io/site/resume.json',
                    method: 'GET',
                    success: function (data) {
                        resumeData = data;
                        $('#btn-en').prop('disabled', false);
                        $('#btn-de').prop('disabled', false);

                        renderAll();
                        if(isfirstload) {
                            loadintro();
                            isfirstload = false;
                        }
                        $('#loading').fadeOut(800);
                    },
                    error: function (jqxhr, textStatus, error) {
                        console.log(error);
                        $('#loading').hide(); 
                        $('main').html('<div class="card"><p style="color: var(--glow-red)">Error loading resume data. Please try again later.</p></div>');
                    }
                });
            } else {
                $('#loading').fadeOut(800); 
            }
        }

        function translate(key, subkey) {
            return i18n[currentLang][key][subkey];
        }

        function setLanguage(lang) {
            load();
            currentLang = lang;
            changelanges = true;
            updateLangBtns();
            renderAll();

            if ($('main').hasClass('intro')) loadintro();        
            if ($('main').hasClass('history')) loadhistory();
            if ($('main').hasClass('skills')) loadskills();
            if ($('main').hasClass('education')) loadedu();

            closeMenu();
        }

        const renderHero = function () {    
            if (!resumeData) return;
            let langs = resumeData[currentLang].languages;
            var langdiv = '';

            $.each(langs, function (index, l) {
                langdiv += `<div class="progress-container">
                           <div class="progress-label">
                                   <b style="color: var(--text-main)">${l.language}</b>
                                   <span style="color: var(--text-muted)">${l.fluency}</span>
                           </div>
                           <div class="progress-bar">
                                   <div class="progress-fill" style="width: ${l.percent}%"></div>
                           </div>
                    </div>`;
            });

            $('#langbar').empty().append($(langdiv));

            if (currentLang === 'en') {
                $('#germany').html('Germany');
                $('#title').html('Senior Full Stack Developer');
            } else {
                $('#germany').html('Deutschland');
                $('#title').html('Senior Full Stack Entwickler');
            }

            $('#lang').html(i18n[currentLang].headers.languages);
        }

        const rendernavbar = function () {
            var d = `
           <li>
               <a href="#" onclick="loadintro()" class="nav-link navlinkcustom about">
                   <i class="fa-solid fa-user"></i>
                   <span id="about">${i18n[currentLang].nav.intro}</span>
               </a>
           </li>
           <li>
               <a href="#" onclick="loadhistory()" class="nav-link navlinkcustom ex">
                   <i class="fa-solid fa-briefcase"></i>
                   <span id="ex">${i18n[currentLang].nav.history}</span>
               </a>
           </li>
           <li>
               <a href="#" onclick="loadskills()" class="nav-link navlinkcustom skill">
                   <i class="fa-solid fa-code"></i>
                   <span id="skill">${i18n[currentLang].nav.skills}</span>
               </a>
           </li>
           <li>
               <a href="#" onclick="loadedu()" class="nav-link navlinkcustom education">
                   <i class="fa fa-book"></i>
                   <span id="edu">${i18n[currentLang].nav.education}</span>
               </a>
           </li>`;

            $('#nav-links').empty().append($(d));
            highlightActiveMenu();
        }

        function highlightActiveMenu() {
            $('a.navlinkcustom').removeClass('active');
            if ($('main').hasClass('intro')) $('.about').addClass('active');
            if ($('main').hasClass('history')) $('.ex').addClass('active');
            if ($('main').hasClass('skills')) $('.skill').addClass('active');
            if ($('main').hasClass('education')) $('.education').addClass('active');
        }

        const loadintro = function () {
            if (!resumeData) { load(); return; }
            var fade = !changelanges ? 'fadein' : '';
            var html = `<section id="section-intro" class="${fade}">
               <div class="card">
                   <div class="section-header" style="border-bottom: none; padding-bottom: 0;">
                       <div class="icon-box"><i class="fa-solid fa-circle-info"></i></div>
                       <h2 style="font-size: 1.5rem">${i18n[currentLang].headers.intro}</h2>
                   </div>
                   <div style="line-height: 1.8; color: var(--text-muted); font-size: 1.1rem; padding-top: 15px;">
                       <p>${resumeData[currentLang].introduction}</p>
                   </div>
               </div>
           </section>`;

            $('main').empty().append($(html)).removeClass('history skills education').addClass('intro');
            highlightActiveMenu();
            closeMenu();
            changelanges = false;
        }

        const loadhistory = function () {
            if (!resumeData) { load(); return; }
            var fade = !changelanges ? 'fadein' : '';
            var html = `<section id="section-history" class="${fade}">
               <div class="section-header">
                   <div class="icon-box" style="color: var(--glow-red); background: rgba(220, 60, 60, 0.1);"><i class="fa-solid fa-briefcase"></i></div>
                   <h2>${i18n[currentLang].headers.experience}</h2>
               </div>
               <div class="timeline">`;

            var history = resumeData[currentLang].employmentHistory;

            $.each(history, function (index, h) {
                let dotClass = index == 0 ? "timeline-dot first" : "timeline-dot";
                let badgeClass = index == 0 ? "badge red" : "badge";
                
                html += `<div class="timeline-item">
                   <div class="${dotClass}"></div>
                   <div class="card">
                       <div class="timeline-header">
                          <div class="timeline-title">
                              <h5>${h.role}</h5>
                              <div class="timeline-meta">
                                  <a href="#" target="_blank"><i class="fa-regular fa-building"></i> ${h.company}</a>
                                  <span>•</span>
                                  <span><i class="fa-solid fa-location-dot"></i> ${h.location}</span>
                              </div>
                          </div>
                          <div><span class="${badgeClass}">${h.startDate} — ${h.endDate}</span></div>
                       </div>
                       <ul class="timeline-list">`;

                $.each(h.responsibilities, function (i, r) {
                    html += `<li><i class="fa-solid fa-circle-check"></i> <span>${r}</span></li>`;
                });

                html += `</ul>
                      <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(30, 80, 150, 0.2);">
                      <small style="color: var(--glow-cyan); font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 10px;">Tech Stack</small>
                      <div>`;

                $.each(h.techStack, function (j, t) {
                    html += `<span class="badge blue">${t}</span>`;
                })

                html += `</div></div></div></div>`;
            });

            html += '</div></section>';
            $('main').empty().append($(html)).removeClass('intro skills education').addClass('history');
            highlightActiveMenu();
            closeMenu();
            changelanges = false;
        }

        const loadskills = function () {
            if (!resumeData) { load(); return; }
            const skills = resumeData[currentLang].technicalSkills;
            const config = {
                backend: { color: "cyan", icon: "fa-solid fa-server" },
                frontend: { color: "red", icon: "fa-solid fa-desktop" },
                database: { color: "blue", icon: "fa-solid fa-database" },
                sourceControl: { color: "cyan", icon: "fa-solid fa-code-branch" },
                projectManagement: { color: "blue", icon: "fa-solid fa-list-check" },
                general: { color: "red", icon: "fa-solid fa-gears" }
            };

            var fade = !changelanges ? 'fadein' : '';
            var html = `<section id="section-skills" class="${fade}">
                <div class="section-header">
                   <div class="icon-box" style="color: var(--glow-blue); background: rgba(30, 80, 150, 0.2);"><i class="fa-solid fa-code"></i></div>
                   <h2>${translate('headers', 'skills')}</h2>
               </div>
               <div class="grid-2">`;

            $.each(config, function (key, conf) {
                const label = i18n[currentLang].categories[key] || key;
                html += `<div class="card" style="margin-bottom: 0;">
                       <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
                           <i class="${conf.icon}" style="color: var(--glow-${conf.color}); font-size: 1.2rem;"></i>
                           <h4 style="color: var(--text-main); font-weight: normal;">${label}</h4>
                       </div>
                       <div>`;
                $.each(skills[key], function (index, skill) {
                    html += `<span class="badge ${conf.color}">${skill}</span>`;
                });
                html += `</div></div>`;
            });

            html += `</div></section>`;
            $('main').empty().append($(html)).removeClass('intro history education').addClass('skills');
            highlightActiveMenu();
            closeMenu();
            changelanges = false;
        }

        const loadedu = function () {
            if (!resumeData) { load(); return; }
            var edu = resumeData[currentLang].education;
            var cer = resumeData[currentLang].certificates;

            var fade = !changelanges ? 'fadein' : '';
            var html = `<section id="section-edu" class="${fade}">
                <div class="section-header">
                   <div class="icon-box"><i class="fa-solid fa-book-open"></i></div>
                   <h2>${translate('headers', 'education')}</h2>
               </div>
               <div class="grid-2">
                   <!-- Universities -->
                   <div class="card">
                       <div class="section-header" style="border:none; margin-bottom:20px; padding-bottom:0;">
                          <div class="icon-box" style="background: transparent; border: 1px solid var(--glow-cyan);"><i class="fa-solid fa-graduation-cap"></i></div>
                          <h4>${i18n[currentLang].headers.universities}</h4>
                       </div>
                   <div>`;

            $.each(edu, function (index, e) {
                html += `<div class="edu-item">
                      <h6>${e.degree}</h6>
                      <a href="${e.link}" target="_blank"><i class="fa-solid fa-building-columns"></i> ${e.institution}</a>
                      <div class="meta">
                          <span>${e.location}</span>
                          <span class="badge" style="margin:0;">${e.startDate} - ${e.endDate}</span>
                      </div>
                  </div>`;
            });

            html += `</div></div>
                   <!-- Certificates -->
                   <div class="card">
                       <div class="section-header" style="border:none; margin-bottom:20px; padding-bottom:0;">
                          <div class="icon-box" style="color: var(--glow-red); background: transparent; border: 1px solid var(--glow-red);"><i class="fa-solid fa-certificate"></i></div>
                          <h4>${i18n[currentLang].headers.certificates}</h4>
                       </div>
                   <div>`;

            $.each(cer, function (index, c) {
                html += `<div class="edu-item" style="display: flex; gap: 15px;">
                  <i class="fa-solid fa-trophy" style="color: var(--glow-red); font-size: 1.2rem; margin-top: 3px;"></i>
                  <div>
                      <h6><a href="${c.link}" target="_blank" style="color: var(--text-main);">${c.title}</a></h6>
                      <div class="meta" style="justify-content: flex-start; gap: 10px;">
                          <span>${c.issuer}</span>
                          <span>•</span>
                          <span>${c.date}</span>
                      </div>
                  </div>
                </div>`;
            });

            html += `</div></div></div></section>`;
            $('main').empty().append($(html)).removeClass('history skills intro').addClass('education');
            highlightActiveMenu();
            closeMenu();
            changelanges = false;
        }

        function updateLangBtns() {
            $('.lang-btn').removeClass('active');
            if (currentLang === 'en') {
                $('#btn-en').addClass('active');
            } else {
                $('#btn-de').addClass('active');
            }
        }

        const renderAll = function () {
            if (resumeData == null) { load(); return; }
            renderHero();
            rendernavbar();
        }

        function closeMenu() {
            $('#nav-menu-container').removeClass('show');
        }

        function toggleMenu() {
            $('#nav-menu-container').toggleClass('show');
        }

        $(document).ready(function() {
            load();
        });

    </script>
</body>
</html>
