<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahman Soltani</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <link rel="stylesheet" href="css.css">
</head>
<body>

    <div id="loading"><i class="fa-solid fa-circle-notch fa-spin"></i></div>

    <nav class="navbar-custom">
        <div class="navbar-brand">
            <i class="fa-solid fa-code" style="color: var(--glow-red-bright); margin-right: 8px;"></i>
            Bahman <span>Soltani</span>
        </div>
        
        <button class="mobile" id="mobile-menu-btn">
            <i class="fa-solid fa-bars"></i>
        </button>

        <ul class="nav-menu" id="nav-links">
            <!-- JS will inject Nav Links here -->
        </ul>
    </nav>

    <div class="container-custom">
        <!-- PROFILE BANNER (Always Visible) -->
        <header class="profile-banner glass-panel">
            <div class="profile-img-container">
                <img src="https://vohuman.github.io/assets/Bild.jpg" alt="Bahman Soltani">
            </div>
            
            <div class="profile-details">
                <h1>Bahman Soltani</h1>
                <h2 id="title">Senior Full Stack Developer</h2>
                
                <p class="mb-2"><i class="fa-solid fa-location-dot" style="color: var(--glow-cyan)"></i> 27356 Rotenburg Wümme, <span id="germany">Germany</span></p>

                <div class="d-flex align-items-center justify-content-start gap-2 mb-1">
                    <i class="fa-solid fa-envelope text-primary"></i>
                    <a href="mailto:bahman.soltani@gmail.com" class="custom-link-hover">bahman.soltani@gmail.com</a>
                </div>
                <div class="d-flex align-items-center justify-content-start gap-2 mb-3">
                    <i class="fa-solid fa-phone text-primary"></i>
                    <a href="tel:+4917655568384" class="custom-link-hover">+4917655568384</a>
                </div>

                <div class="d-flex flex-wrap gap-2 justify-content-start mt-3">
                    <a class="btn-action" target="_blank" href="https://www.linkedin.com/in/vohuman/">
                        <i class="fa-brands fa-linkedin"></i> LinkedIn
                    </a>
                </div>
            </div>

            <div class="languages-container">
                <h4 class="mb-3 text-primary fw-bold" id="lang-title"><i class="fa-solid fa-language me-2"></i>Languages</h4>
                <div id="langbar">
                    
                </div>
            </div>
        </header>

        
        <main id="main-content">
            
        </main>
        
        
        <footer class="text-center mt-4 pb-2 border-top pt-2">
            <p>&copy; 2026 Bahman Soltani</p>
              <p>
                    <a href="mailto:bahman.soltani@gmail.com">
                        <i class="fa-solid fa-envelope text-primary"></i>
                    </a>
                    <a target="_blank" href="https://www.linkedin.com/in/vohuman/">
                        <i class="fa-brands fa-linkedin text-primary"></i>
                    </a>
              </p>
        </footer>
    </div>

    <script>
        let currentLang = 'en';
        let changelanges = false;
        let resumeData = null;

        $('#mobile-menu-btn').click(function() {
            $('#nav-links').toggleClass('active');
        });

        // Close mobile menu on link click
        $(document).on('click', '.navlinkcustom', function() {
            if($(window).width() <= 768) {
                $('#nav-links').removeClass('active');
            }
        });

        const i18n = {
            en: {
                headers: {
                    intro: "Introduction",
                    languages: "Languages",
                    skills: "Technical Skills",
                    experience: "Employment History",
                    education: "Education",
                    certificates: "Certificates",
                    universities: "Universities"
                },
                nav: {
                    intro: "About",
                    history: "Experience",
                    skills: "Skills",
                    education: "Education"
                },
                categories: {
                    backend: "Backend",
                    frontend: "Frontend",
                    database: "Database",
                    sourceControl: "DevOps & Tools",
                    projectManagement: "Management",
                    general: "General"
                }
            },
            de: {
                headers: {
                    intro: "Einführung",
                    languages: "Sprachkenntnisse",
                    skills: "Technische Fähigkeiten",
                    experience: "Berufserfahrung",
                    education: "Ausbildung",
                    certificates: "Zertifikate",
                    universities: "Universitäten"
                },
                nav: {
                    intro: "Über mich",
                    history: "Erfahrung",
                    skills: "Fähigkeiten",
                    education: "Ausbildung"
                },
                categories: {
                    backend: "Backend",
                    frontend: "Frontend",
                    database: "Datenbank",
                    sourceControl: "DevOps & Tools",
                    projectManagement: "Management",
                    general: "Allgemein"
                }
            }
        };

        function load() {
            $('#loading').show();
            if (resumeData == null) {
                $.ajax({
                    url: 'https://vohuman.github.io/site/resume.json',
                    method: 'GET',
                    success: function (data) {
                        resumeData = data;
                        renderAll();
                        $('#loading').fadeOut(800);
                    },
                    error: function (jqxhr, textStatus, error) {
                        console.log("Error loading JSON:", error);
                        $('#loading').hide(); 
                        $('#main-content').html('<div class="glass-panel p-4 text-center" style="color: var(--glow-red-bright);">Error loading profile data. Please try again later.</div>');
                    }
                });
            } else {
                $('#loading').fadeOut(500); 
            }
        }

        function setLanguage(lang) {
            currentLang = lang;
            changelanges = true;
            
            updateLangBtns();
            renderHero();
            rendersidemenu();

            let mainClasses = $('#main-content').attr('class') || '';
            if (mainClasses.includes('intro')) loadintro();
            else if (mainClasses.includes('history')) loadhistory();
            else if (mainClasses.includes('skills')) loadskills();
            else if (mainClasses.includes('education')) loadedu();
            else loadintro(); 
        }

        function updateLangBtns() {
            $('.lang-btn').removeClass('active');
            if (currentLang === 'en') {
                $('#btn-en').addClass('active');
            } else {
                $('#btn-de').addClass('active');
            }
        }

        function renderHero() {    
            if (!resumeData) return;
            let langs = resumeData[currentLang].languages;
            let langHTML = '';

            $.each(langs, function (index, l) {
                langHTML += `
                <div class="lang-item">
                    <div class="lang-header">
                        <b class="text-dark">${l.language}</b>
                        <span class="text-muted">${l.fluency}</span>
                    </div>
                    <div class="progress-bg">
                        <div class="progress-fill" style="width: ${l.percent}%"></div>
                    </div>
                </div>`;
            });
            $('#langbar').html(langHTML);

            if (currentLang === 'en') {
                $('#germany').text('Germany');
                $('.footer-germany').text('Germany');
                $('#title').text('Senior Full Stack Developer');
                $('#lang-title').html('<i class="fa-solid fa-language me-2"></i>Languages');
            } else {
                $('#germany').text('Deutschland');
                $('.footer-germany').text('Deutschland');
                $('#title').text('Senior Full Stack Entwickler');
                $('#lang-title').html('<i class="fa-solid fa-language me-2"></i>Sprachkenntnisse');
            }
        }

        function rendersidemenu() {
            var navHTML = `
               <li><a href="#" onclick="loadintro(); return false;" class="navlinkcustom about active"><i class="fa-solid fa-user"></i> ${i18n[currentLang].nav.intro}</a></li>
               <li><a href="#" onclick="loadhistory(); return false;" class="navlinkcustom ex"><i class="fa-solid fa-briefcase"></i> ${i18n[currentLang].nav.history}</a></li>
               <li><a href="#" onclick="loadskills(); return false;" class="navlinkcustom skill"><i class="fa-solid fa-code"></i> ${i18n[currentLang].nav.skills}</a></li>
               <li><a href="#" onclick="loadedu(); return false;" class="navlinkcustom edu"><i class="fa-solid fa-book"></i> ${i18n[currentLang].nav.education}</a></li>
               
               <div class="lang-switch">
                   <button id="btn-en" class="lang-btn ${currentLang === 'en' ? 'active' : ''}" onclick="setLanguage('en')">EN</button>
                   <button id="btn-de" class="lang-btn ${currentLang === 'de' ? 'active' : ''}" onclick="setLanguage('de')">DE</button>
               </div>
            `;
            $('#nav-links').html(navHTML);
        }

        function updateActiveNav(className) {
            $('.navlinkcustom').removeClass('active');
            $(`.${className}`).addClass('active');
            $('#main-content').removeClass('intro history skills education').addClass(className);
        }

        function loadintro() {
            if (!resumeData) return load();
            var fade = !changelanges ? 'fadein' : '';
            
            var html = `
            <div class="glass-panel p-4 ${fade}">
               <div class="d-flex align-items-center gap-3 mb-4">
                   <div class="icon-box"><i class="fa-solid fa-circle-info"></i></div>
                   <h2 class="h3 fw-bold mb-0 text-dark">${i18n[currentLang].headers.intro}</h2>
               </div>
               <p class="fs-5 text-secondary" style="line-height: 1.8; text-align: justify;">
                   ${resumeData[currentLang].introduction}
               </p>
            </div>`;
            
            $('#main-content').html(html);
            updateActiveNav('intro');
            changelanges = false;
        }

        function loadhistory() {
            if (!resumeData) return load();
            var fade = !changelanges ? 'fadein' : '';
            
            var html = `
            <div class="${fade}">
               <div class="d-flex align-items-center gap-3 mb-4 pb-2 border-bottom">
                   <div class="icon-box"><i class="fa-solid fa-briefcase"></i></div>
                   <h2 class="h3 fw-bold mb-0 text-dark">${i18n[currentLang].headers.experience}</h2>
               </div>`;

            var history = resumeData[currentLang].employmentHistory;

            $.each(history, function (index, h) {
                let dotClass = index === 0 ? 'first' : '';
                let badgeClass = index === 0 ? 'badge-red' : 'badge-custom';
                
                html += `
                <div class="timeline-item">
                   <div class="timeline-dot ${dotClass}"></div>
                   <div class="glass-panel p-4">
                       <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-2 mb-3">
                          <div>
                              <h4 class="fw-bold text-primary mb-1">${h.role}</h4>
                              <div class="d-flex flex-wrap align-items-center gap-2 text-secondary">
                                  <span class="fw-semibold text-dark"><i class="fa-regular fa-building me-1"></i> ${h.company}</span>
                                  <span>•</span>
                                  <span><i class="fa-solid fa-location-dot me-1"></i>${h.location}</span>
                              </div>
                          </div>
                          <span class="${badgeClass} px-3 py-2 fw-bold" style="font-size:0.9rem;">
                              ${h.startDate} — ${h.endDate}
                          </span>
                       </div>

                       <div class="mb-3">
                          <ul class="list-unstyled d-flex flex-column gap-2 mb-0">`;

                $.each(h.responsibilities, function (i, r) {
                    html += `
                        <li class="d-flex gap-2 text-secondary">
                           <i class="fa-solid fa-angle-right text-primary mt-1"></i>
                           <span>${r}</span>
                        </li>`;
                });

                html += `</ul>
                       </div>
                       
                       <div class="pt-3 border-top">
                          <small class="text-uppercase fw-bold text-muted d-block mb-2" style="letter-spacing:1px;">Tech Stack</small>
                          <div class="d-flex flex-wrap gap-1">`;

                // Render all tech stack badges in uniform Cyan
                $.each(h.techStack, function (j, t) {
                    html += `<span class="badge-custom">${t}</span>`;
                });

                html += `</div></div></div></div>`;
            });

            html += '</div>';
            $('#main-content').html(html);
            updateActiveNav('history');
            changelanges = false;
        }

        function loadskills() {
            if (!resumeData) return load();
            var fade = !changelanges ? 'fadein' : '';
            const skills = resumeData[currentLang].technicalSkills;
            
            // Replaced purple with bright cyan/cyan variations to keep theme consistent
            const config = {
                backend: { color: "var(--glow-cyan-bright)", icon: "fa-solid fa-server" },
                frontend: { color: "var(--glow-red-bright)", icon: "fa-solid fa-desktop" },
                database: { color: "#4ade80", icon: "fa-solid fa-database" },
                sourceControl: { color: "#fbd38d", icon: "fa-solid fa-code-branch" },
                projectManagement: { color: "var(--glow-cyan)", icon: "fa-solid fa-list-check" },
                general: { color: "var(--text-main)", icon: "fa-solid fa-gears" }
            };

            var html = `
            <div class="${fade}">
                <div class="d-flex align-items-center gap-3 mb-4 pb-2 border-bottom">
                   <div class="icon-box"><i class="fa-solid fa-code"></i></div>
                   <h2 class="h3 fw-bold mb-0 text-dark">${i18n[currentLang].headers.skills}</h2>
                </div>
                <div class="row g-4">`;

            $.each(config, function (key, conf) {
                const label = i18n[currentLang].categories[key] || key;
                html += `
                <div class="col-lg-6">
                   <div class="glass-panel p-4 h-100">
                       <div class="d-flex align-items-center gap-3 mb-3 pb-2 border-bottom">
                           <i class="${conf.icon} fs-5" style="color:${conf.color}"></i>
                           <h5 class="fw-bold mb-0" style="color:${conf.color}">${label}</h5>
                       </div>
                       <div class="d-flex flex-wrap gap-2">`;
                       
                $.each(skills[key], function (index, skill) {
                    html += `<span class="badge-custom" style="border-color:${conf.color}; color:${conf.color}; background:transparent;">${skill}</span>`;
                });

                html += `</div></div></div>`;
            });

            html += `</div></div>`;
            $('#main-content').html(html);
            updateActiveNav('skills');
            changelanges = false;
        }

        function loadedu() {
            if (!resumeData) return load();
            var fade = !changelanges ? 'fadein' : '';
            var edu = resumeData[currentLang].education;
            var cer = resumeData[currentLang].certificates;

            var html = `
            <div class="${fade}">
                <div class="d-flex align-items-center gap-3 mb-4 pb-2 border-bottom">
                   <div class="icon-box"><i class="fa-solid fa-book"></i></div>
                   <h2 class="h3 fw-bold mb-0 text-dark">${i18n[currentLang].headers.education}</h2>
                </div>
                <div class="row g-4">
                   <div class="col-lg-6">
                       <div class="glass-panel p-4 h-100">
                           <div class="d-flex align-items-center gap-3 mb-4">
                              <div class="icon-box" style="color:var(--glow-red-bright)"><i class="fa-solid fa-graduation-cap"></i></div>
                              <h5 class="fw-bold mb-0 text-dark">${i18n[currentLang].headers.universities}</h5>
                           </div>
                           <div class="d-flex flex-column gap-4">`;

            $.each(edu, function (index, e) {
                html += `
                <div>
                    <h5 class="fw-bold text-primary mb-1">${e.degree}</h5>
                    <p class="mb-1 text-secondary">
                        <a href="${e.link}" target="_blank" class="fw-semibold text-dark custom-link-hover">${e.institution}</a>
                    </p>
                    <div class="d-flex justify-content-between align-items-center text-muted small">
                        <span><i class="fa-solid fa-location-dot"></i> ${e.location}</span>
                        <span class="badge-custom m-0">${e.startDate} - ${e.endDate}</span>
                    </div>
                </div>`;
            });

            html += `</div></div></div>
            <div class="col-lg-6">
               <div class="glass-panel p-4 h-100">
                   <div class="d-flex align-items-center gap-3 mb-4">
                      <div class="icon-box" style="color:var(--glow-cyan-bright)"><i class="fa-solid fa-certificate"></i></div>
                      <h5 class="fw-bold mb-0 text-dark">${i18n[currentLang].headers.certificates}</h5>
                   </div>
                   <div class="d-flex flex-column gap-3">`;

            $.each(cer, function (index, c) {
                html += `
                <div class="d-flex gap-3 align-items-start border-bottom pb-2">
                  <i class="fa-solid fa-trophy text-primary mt-1"></i>
                  <div>
                      <h6 class="mb-1 fw-bold">
                           <a href="${c.link}" target="_blank" class="text-dark custom-link-hover">${c.title}</a>
                      </h6>
                      <div class="d-flex flex-wrap gap-2 text-muted small">
                          <span>${c.issuer}</span>
                          <span>•</span>
                          <span>${c.date}</span>
                      </div>
                  </div>
                </div>`;
            });

            html += `</div></div></div></div></div>`;
            
            $('#main-content').html(html);
            updateActiveNav('education');
            changelanges = false;
        }

        function renderAll() {
            rendersidemenu();
            renderHero();
            loadintro();
        }

        // Initialize
        $(document).ready(function() {
            load();
        });

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
