
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahman Soltani</title>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <style>
        :root {
            --bg-base: #040814;
            --bg-darker: #02040a;
            --bg-card: #091330;
            --glow-cyan: #2D91C3;
            --glow-cyan-bright: #45c4ff;
            --glow-red: #DC3C3C;
            --glow-red-bright: #ff5e5e;
            --glow-blue: #1E5096;
            --glow-blue-light: #3E70B6;
            --text-main: #f0f4f8;
            --text-muted: #a0aec0;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            --royalblue: #4169E1;
            --light-royalblue: #C1E9FF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(ellipse at 95% 65%, rgba(220, 60, 60, 0.6) 0%, transparent 45%), 
                    radial-gradient(ellipse at 25% 55%, rgba(45, 145, 195, 0.6) 0%, transparent 60%), 
                    radial-gradient(ellipse at 50% 45%, rgba(30, 80, 150, 0.4) 0%, transparent 55%), 
                    linear-gradient(180deg, #02040a 0%, #091330 50%, #02040a 100%);
            background-attachment: fixed;
            line-height: 1.6;
        }

        h2, h3, h4 {
            color: var(--glow-blue-light);
        }

        .glass-panel {
            background: rgba(9, 19, 48, 0.4) !important;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(69, 196, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .glass-panel > * {
            position: relative;
            z-index: 2;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(30, 80, 150, 0.25) !important; 
            transform: scaleX(0);
            transform-origin: center;
            transition: transform 0.5s ease-in-out;
            z-index: 0;
        }

        .glass-panel:hover::before {
            transform: scaleX(1);
        }

        .glass-panel:hover {
            border-color: rgba(69, 196, 255, 0.4);
            box-shadow: 0 10px 40px 0 rgba(45, 145, 195, 0.25);
            transform: translateY(-3px);
        }

        .navbar-custom {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 3%;
            background: rgba(4, 8, 20, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(45, 145, 195, 0.2);
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .navbar-brand span {
            color: var(--text-main);
        }

        .nav-menu {
            display: flex;
            gap: 20px;
            align-items: center;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-menu li a {
            font-weight: 500;
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-menu li a:hover, .nav-menu li a.active {
            color: var(--glow-cyan-bright);
            background: rgba(45, 145, 195, 0.15);
            text-shadow: 0 0 10px var(--glow-cyan);
        }

        .lang-switch {
            display: flex;
            gap: 10px;
            margin-left: 20px;
            border-left: 1px solid rgba(255,255,255,0.1);
            padding-left: 20px;
        }

        .lang-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .lang-btn.active, .lang-btn:hover {
            border-color: var(--glow-cyan-bright);
            color: var(--glow-cyan-bright);
            background: rgba(45, 145, 195, 0.1);
            box-shadow: 0 0 10px rgba(45,145,195,0.3);
        }

        .mobile {
            display: none;
            background: none;
            border: none;
            color: var(--glow-cyan-bright);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .layout-container {
            max-width: 1920px;
            width: 96%;
            margin: 0 auto;
            padding: 30px 2%;
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .sidebar {
            width: 380px;
            flex-shrink: 0;
            padding: 30px;
            position: sticky;
            top: 90px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-height: calc(100vh - 110px);
            overflow-y: auto;
        }

        /* Sidebar Custom Scrollbar */
        .sidebar::-webkit-scrollbar {
            width: 5px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(45, 145, 195, 0.3);
            border-radius: 3px;
        }

        .main-wrapper {
            flex-grow: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .profile-img-container {
            width: 160px;
            height: 160px;
            margin: 0 auto;
            border-radius: 50%;
            border: 3px solid var(--glow-cyan);
            box-shadow: 0 0 20px rgba(45, 145, 195, 0.8), 0 0 40px rgba(45, 145, 195, 0.4);
            animation: pulseGlow 3s infinite alternate;
            overflow: hidden;
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 15px rgba(45, 145, 195, 0.6);
                border-color: var(--glow-cyan);
            }
            100% {
                box-shadow: 0 0 30px rgba(69, 196, 255, 1);
                border-color: var(--glow-cyan-bright);
            }
        }

        .profile-details h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 5px;
            background: linear-gradient(90deg, var(--glow-cyan-bright), #fff, var(--glow-red-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(69, 196, 255, 0.4));
        }

        .profile-details h2 {
            font-size: 1.6rem;
            margin-bottom: 15px;
            font-weight: 500;
            background: linear-gradient(90deg, var(--glow-cyan-bright), #fff, var(--glow-red-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(69, 196, 255, 0.4));
    
        }

        .custom-link-hover {
            text-decoration: none;
            position: relative;
            color: inherit;
        }

        .custom-link-hover::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 2px;
            bottom: -2px;
            left: 0;
            background-color: var(--glow-cyan-bright);
            transform-origin: bottom right;
            transition: transform 0.255s ease-out;
            box-shadow: 0 0 8px var(--glow-cyan);
        }

        .custom-link-hover:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }

        .custom-link-hover:hover {
            color: var(--glow-cyan-bright) !important;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(220, 60, 60, 0.15);
            border: 1px solid var(--glow-red);
            color: var(--glow-red-bright);
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(220, 60, 60, 0.3);
            text-decoration: none;
        }

        .btn-action:hover {
            background: var(--glow-red);
            color: white;
            box-shadow: 0 0 25px rgba(220, 60, 60, 0.8);
            transform: translateY(-2px);
        }

        .languages-container {
            border-top: 1px solid rgba(69, 196, 255, 0.2);
            padding-top: 20px;
        }

        .lang-item {
            margin-bottom: 15px;
        }

        .lang-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .progress-bg {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--glow-blue), var(--glow-cyan-bright));
            border-radius: 3px;
            transition: width 1s ease;
            box-shadow: 0 0 10px rgba(69, 196, 255, 0.8);
        }

        #main-content {
            min-height: 400px;
            flex-grow: 1;
        }

        .timeline-item {
            position: relative;
            padding-left: 30px;
            margin-bottom: 30px;
            border-left: 2px solid rgba(45, 145, 195, 0.3);
        }

        .timeline-dot {
            position: absolute;
            left: -8px;
            top: 20px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--glow-cyan);
            box-shadow: 0 0 10px var(--glow-cyan);
        }

        .timeline-dot.first {
            border-color: var(--glow-red-bright);
            box-shadow: 0 0 10px var(--glow-red-bright);
        }

        .badge-custom {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin: 4px 4px 4px 0;
            border: 1px solid rgba(45, 145, 195, 0.5);
            background: rgba(45, 145, 195, 0.1);
            color: var(--glow-cyan-bright);
        }

        .badge-red {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin: 4px 4px 4px 0;
            border: 1px solid rgba(45, 145, 195, 0.5);
            background: rgba(220, 60, 60, 0.1);
            color: var(--glow-red-bright);
            border-color: var(--glow-red);
        }

        .icon-box {
            background: rgba(45, 145, 195, 0.15);
            color: var(--glow-cyan-bright);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(45, 145, 195, 0.3);
            border: 1px solid rgba(45, 145, 195, 0.3);
        }

        .icon-box-red {
            background: rgba(220, 60, 60, 0.15);
            color: var(--glow-red-bright);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(220, 60, 60, 0.3);
            border: 1px solid rgba(220, 60, 60, 0.3);
        }

        .text-primary { color: var(--glow-cyan-bright) !important; }
        .text-dark { color: var(--text-main) !important; }
        .text-secondary { color: var(--text-muted) !important; }
        .text-muted { color: #8e9db0 !important; }
        .border-bottom { border-bottom: 1px solid rgba(255,255,255,0.1) !important; }
        .border-top { border-top: 1px solid rgba(255,255,255,0.1) !important; }

        a { text-decoration: none; color: inherit; }

        .fadein { animation: fadeIn 0.5s ease-in; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loader */
        #loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg-base);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--glow-cyan-bright);
            font-size: 2rem;
        }

        @media (max-width: 992px) {
            .layout-container {
                flex-direction: column;
                padding-top: 20px;
            }
            .sidebar {
                width: 100%;
                position: static;
                max-height: none;
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 30px 20px;
            }
            
            .languages-container {
                width: 100%;
                text-align: left; /* Keep progress bars aligned */
            }

            .profile-details .d-flex {
                justify-content: center !important;
                flex-wrap: wrap;
                word-break: break-word;
            }
        }

        @media (max-width: 768px) {
            .mobile { display: block; }
            .nav-menu {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: rgba(4, 8, 20, 0.95);
                backdrop-filter: blur(20px);
                flex-direction: column;
                padding: 20px;
                border-bottom: 1px solid rgba(45, 145, 195, 0.3);
                display: none;
            }
            .nav-menu.active { display: flex; }
            .lang-switch {
                margin: 10px 0 0 0;
                border-left: none;
                border-top: 1px solid rgba(255,255,255,0.1);
                padding: 15px 0 0 0;
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div id="loading"><i class="fa-solid fa-circle-notch fa-spin"></i></div>

    <nav class="navbar-custom">
        <div class="navbar-brand">
            <span>Bahman Soltani</span>
        </div>
        
        <button class="mobile" id="mobile-menu-btn">
            <i class="fa-solid fa-bars"></i>
        </button>

        <ul class="nav-menu" id="nav-links">
            <!-- Navigation Links populated by JS -->
        </ul>
    </nav>

    <div class="layout-container">
        
        <!-- SIDEBAR -->
        <aside class="sidebar glass-panel">
            <div class="profile-img-container">
                <img src="https://avatars.githubusercontent.com/vohuman" alt="Bahman Soltani" onerror="this.src='https://placehold.co/160x160/091330/45c4ff?text=BS'">
            </div>
            
            <div class="profile-details">
                <h1>Bahman Soltani</h1>
                <h2 id="title">Senior Full Stack Developer</h2>
                
                <p class="mb-3 text-secondary"><i class="fa-solid fa-location-dot" style="color: var(--glow-cyan)"></i> 27356 Rotenburg Wümme, <span id="germany">Germany</span></p>

                <div class="d-flex align-items-center justify-content-start gap-2 mb-2">
                    <i class="fa-solid fa-envelope text-primary"></i>
                    <a href="mailto:bahman.soltani@gmail.com" class="custom-link-hover fw-medium text-secondary">bahman.soltani@gmail.com</a>
                </div>
                <div class="d-flex align-items-center justify-content-start gap-2 mb-4">
                    <i class="fa-solid fa-phone text-primary"></i>
                    <a href="tel:+4917655568384" class="custom-link-hover fw-medium text-secondary">+4917655568384</a>
                </div>

                <div class="d-flex flex-wrap gap-2 justify-content-start">
                    <a class="btn-action w-100 justify-content-center" target="_blank" href="https://www.linkedin.com/in/vohuman/">
                        <i class="fa-brands fa-linkedin"></i> LinkedIn
                    </a>
                </div>
            </div>

            <div class="languages-container">
                <h5 class="mb-3 text-primary fw-bold" id="lang-title"><i class="fa-solid fa-language me-2"></i>Languages</h5>

                    <!-- Languages loaded here -->
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <div class="main-wrapper">
            <main id="main-content">
                <!-- Content loaded via JS here -->
            </main>
            
            <footer class="text-center mt-5 pb-3 pt-4 border-top">
                <p class="text-muted mb-2">&copy; 2026 Bahman Soltani</p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="mailto:bahman.soltani@gmail.com" class="custom-link-hover">
                        <i class="fa-solid fa-envelope text-primary fs-5"></i>
                    </a>
                    <a target="_blank" href="https://www.linkedin.com/in/vohuman/" class="custom-link-hover">
                        <i class="fa-brands fa-linkedin text-primary fs-5"></i>
                    </a>
                </div>
            </footer>
        </div>

    </div>

    <!-- Bootstrap Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let currentLang = 'de';
        let changelanges = false;
        let resumeData = null;

        $('#mobile-menu-btn').click(function () {
            $('#nav-links').toggleClass('active');
        });

        $(document).on('click', '.navlinkcustom', function () {
            if ($(window).width() <= 768) {
                $('#nav-links').removeClass('active');
            }
        });

        const i18n = {
            en: {
                headers: {
                    intro: "Introduction",
                    languages: "Languages",
                    skills: "Technical Skills",
                    experience: "Employment History",
                    education: "Education",
                    certificates: "Certificates",
                    universities: "Universities"
                },
                nav: {
                    intro: "About",
                    history: "Experience",
                    skills: "Skills",
                    education: "Education"
                },
                categories: {
                    backend: "Backend",
                    frontend: "Frontend",
                    database: "Database",
                    sourceControl: "DevOps & Tools",
                    projectManagement: "Management",
                    general: "General"
                }
            },
            de: {
                headers: {
                    intro: "Einführung",
                    languages: "Sprachkenntnisse",
                    skills: "Technische Fähigkeiten",
                    experience: "Berufserfahrung",
                    education: "Ausbildung",
                    certificates: "Zertifikate",
                    universities: "Universitäten"
                },
                nav: {
                    intro: "Über mich",
                    history: "Erfahrung",
                    skills: "Fähigkeiten",
                    education: "Ausbildung"
                },
                categories: {
                    backend: "Backend",
                    frontend: "Frontend",
                    database: "Datenbank",
                    sourceControl: "DevOps & Tools",
                    projectManagement: "Management",
                    general: "Allgemein"
                }
            }
        };

        function load() {
            $('#loading').show();
            if (resumeData == null) {
                $.ajax({
                    url: 'https://vohuman.github.io/site/resume.json',
                    method: 'GET',
                    success: function (data) {
                        resumeData = data;
                        renderAll();
                        $('#loading').fadeOut(800);
                    },
                    error: function (jqxhr, textStatus, error) {
                        console.log("Error loading JSON:", error);
                        $('#loading').hide();
                        $('#main-content').html('<div class="glass-panel p-4 text-center" style="color: var(--glow-red-bright);">Error loading profile data. Please try again later.</div>');
                    }
                });
            } else {
                $('#loading').fadeOut(500);
            }
        }

        function setLanguage(lang) {
            currentLang = lang;
            changelanges = true;

            updateLangBtns();
            renderHero();
            rendersidemenu();

            let mainClasses = $('#main-content').attr('class') || '';
            if (mainClasses.includes('intro')) loadintro();
            else if (mainClasses.includes('history')) loadhistory();
            else if (mainClasses.includes('skills')) loadskills();
            else if (mainClasses.includes('education')) loadedu();
            else loadintro();
        }

        function updateLangBtns() {
            $('.lang-btn').removeClass('active');
            if (currentLang === 'en') {
                $('#btn-en').addClass('active');
            } else {
                $('#btn-de').addClass('active');
            }
        }

        function renderHero() {
            if (!resumeData) return;

            $('#loading').show();
            let langs = resumeData[currentLang].languages;
            let langHTML = '';

            $.each(langs, function (index, l) {
                langHTML += `
                        <div class="lang-item">
                            <div class="lang-header">
                                <b class="text-dark">${l.language}</b>
                                <span class="text-muted">${l.fluency}</span>
                            </div>
                            <div class="progress-bg">
                                <div class="progress-fill" style="width: ${l.percent}%"></div>
                            </div>
                        </div>`;
            });
            $('#langbar').html(langHTML);
            $('#loading').fadeOut(500);

            if (currentLang === 'en') {
                $('#germany').text('Germany');
                $('#title').text('Senior Full Stack Developer');
                $('#lang-title').html('<i class="fa-solid fa-language me-2"></i>Languages');
            } else {
                $('#germany').text('Deutschland');
                $('#title').text('Senior Full Stack Entwickler');
                $('#lang-title').html('<i class="fa-solid fa-language me-2"></i>Sprachkenntnisse');
            }
        }

        function rendersidemenu() {
            var navHTML = `
                       <li><a href="#" onclick="loadintro(); return false;" class="navlinkcustom about active"><i class="fa-solid fa-user"></i> ${i18n[currentLang].nav.intro}</a></li>
                       <li><a href="#" onclick="loadhistory(); return false;" class="navlinkcustom ex"><i class="fa-solid fa-briefcase"></i> ${i18n[currentLang].nav.history}</a></li>
                       <li><a href="#" onclick="loadskills(); return false;" class="navlinkcustom skill"><i class="fa-solid fa-code"></i> ${i18n[currentLang].nav.skills}</a></li>
                       <li><a href="#" onclick="loadedu(); return false;" class="navlinkcustom edu"><i class="fa-solid fa-book-open"></i> ${i18n[currentLang].nav.education}</a></li>
                       
                       <div class="lang-switch">
                           <button id="btn-en" class="lang-btn ${currentLang === 'en' ? 'active' : ''}" onclick="setLanguage('en')">EN</button>
                           <button id="btn-de" class="lang-btn ${currentLang === 'de' ? 'active' : ''}" onclick="setLanguage('de')">DE</button>
                       </div>
                    `;
            $('#nav-links').html(navHTML);
        }

        function updateActiveNav(className) {
            $('.navlinkcustom').removeClass('active');
            $(`.${className}`).addClass('active');
            $('#main-content').removeClass('intro history skills education').addClass(className);
        }

        function loadintro() {
            if (!resumeData) return load();
            var fade = !changelanges ? 'fadein' : '';
            $('#loading').show();
            var html = `
                    <div class="glass-panel p-4 ${fade}">
                       <div class="d-flex align-items-center gap-3 mb-4">
                           <div class="icon-box"><i class="fa-solid fa-circle-info"></i></div>
                           <h2 class="fw-bold mb-0 text-dark">${i18n[currentLang].headers.intro}</h2>
                       </div>
                       <p class="fs-5 text-secondary" style="line-height: 1.8; text-align: justify;">
                           ${resumeData[currentLang].introduction}
                       </p>
                    </div>`;

            $('#main-content').html(html);
            updateActiveNav('intro');
            changelanges = false;

            var links = $('a.navlinkcustom');
            $.each(links, function(index, link) {
                $(link).removeClass('active');
            });
            $('.about').addClass('active');
            
            $('#loading').fadeOut(500);
        }

        function loadhistory() {
            if (!resumeData) return load();
            var fade = !changelanges ? 'fadein' : '';

            $('#loading').show();
            var html = `
                    <div class="${fade}">
                       <div class="d-flex align-items-center gap-3 mb-4 pb-2 border-bottom">
                           <div class="icon-box"><i class="fa-solid fa-briefcase"></i></div>
                           <h2 class="fw-bold mb-0">${i18n[currentLang].headers.experience}</h2>
                       </div>`;

            var history = resumeData[currentLang].employmentHistory;

            $.each(history, function (index, h) {
                let dotClass = index === 0 ? 'first' : '';
                let badgeClass = index === 0 ? 'badge-red' : 'badge-custom';

                html += `
                        <div class="timeline-item">
                           <div class="timeline-dot ${dotClass}"></div>
                           <div class="glass-panel p-4">
                               <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-2 mb-3">
                                  <div>
                                      <h4 class="fw-bold mb-1">${h.role}</h4>
                                      <div class="d-flex flex-wrap align-items-center gap-2">
                                          <a href="${h.link}" target="_blank" rel="noopener noreferrer" class="text-decoration-none custom-link-hover text-primary">
                                              <span class="fw-semibold"><i class="fa-regular fa-building me-1"></i> ${h.company}</span>
                                          </a>
                                          <span>•</span>
                                          <span><i class="fa-solid fa-location-dot me-1"></i>${h.location}</span>
                                      </div>
                                  </div>
                                  <span class="${badgeClass} px-3 py-2 fw-bold" style="font-size:0.9rem;">
                                      ${h.startDate} — ${h.endDate}
                                  </span>
                               </div>

                               <div class="mb-3">
                                  <ul class="list-unstyled d-flex flex-column gap-2 mb-0">`;

                $.each(h.responsibilities, function (i, r) {
                    html += `
                                <li class="d-flex gap-2">
                                   <i class="fa-solid fa-circle-check text-primary mt-1"></i>
                                   <span>${r}</span>
                                </li>`;
                });

                html += `</ul>
                               </div>
                               
                               <div class="pt-3 border-top">
                                  <small class="text-uppercase fw-bold text-muted d-block mb-2" style="letter-spacing:1px;">Tech Stack</small>
                                  <div class="d-flex flex-wrap gap-1">`;

                $.each(h.techStack, function (j, t) {
                    html += `<span class="badge-custom" style="color:var(--light-royalblue)">${t}</span>`;
                });

                html += `</div></div></div></div>`;
            });

            html += '</div>';
            $('#main-content').html(html);
            updateActiveNav('history');
            changelanges = false;

             var links = $('a.navlinkcustom');
            $.each(links, function(index, link) {
                $(link).removeClass('active');
            });
            $('.ex').addClass('active');
            
            $('#loading').fadeOut(500);
        }

        function loadskills() {
            if (!resumeData) return load();
            var fade = !changelanges ? 'fadein' : '';
            const skills = resumeData[currentLang].technicalSkills;

            $('#loading').show();
            const config = {
                backend: { color: "var(--glow-cyan-bright)", icon: "fa-solid fa-server" },
                frontend: { color: "var(--glow-red-bright)", icon: "fa-solid fa-desktop" },
                database: { color: "#4ade80", icon: "fa-solid fa-database" },
                sourceControl: { color: "#fbd38d", icon: "fa-solid fa-code-branch" },
                projectManagement: { color: "var(--glow-cyan)", icon: "fa-solid fa-list-check" },
                general: { color: "var(--text-main)", icon: "fa-solid fa-gears" }
            };

            var html = `
                    <div class="${fade}">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-2 border-bottom">
                           <div class="icon-box"><i class="fa-solid fa-code"></i></div>
                           <h2 class="fw-bold mb-0">${i18n[currentLang].headers.skills}</h2>
                        </div>
                        <div class="row g-4">`;

            $.each(config, function (key, conf) {
                const label = i18n[currentLang].categories[key] || key;
                html += `
                        <div class="col-lg-6">
                           <div class="glass-panel p-4 h-100">
                               <div class="d-flex align-items-center gap-3 mb-3 pb-2 border-bottom">
                                   <i class="${conf.icon} fs-5" style="color:${conf.color}"></i>
                                   <h5 class="fw-bold mb-0" style="color:${conf.color}">${label}</h5>
                               </div>
                               <div class="d-flex flex-wrap gap-2">`;

                $.each(skills[key], function (index, skill) {
                    html += `<span class="badge-custom" style="border-color:${conf.color}; color:${conf.color}; background:transparent;">${skill}</span>`;
                });

                html += `</div></div></div>`;
            });

            html += `</div></div>`;
            $('#main-content').html(html);
            updateActiveNav('skills');
            changelanges = false;

            var links = $('a.navlinkcustom');
            $.each(links, function(index, link) {
                $(link).removeClass('active');
            });
            $('.skill').addClass('active');    
            
            $('#loading').fadeOut(500);
        }

        function loadedu() {
            if (!resumeData) return load();
            var fade = !changelanges ? 'fadein' : '';
            var edu = resumeData[currentLang].education;
            var cer = resumeData[currentLang].certificates;

            $('#loading').show();
            var html = `
                    <div class="${fade}">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-2 border-bottom">
                           <div class="icon-box"><i class="fa-solid fa-book-open"></i></div>
                           <h2 class="fw-bold mb-0">${i18n[currentLang].headers.education}</h2>
                        </div>
                        <div class="row g-4">
                           <div class="col-lg-6">
                               <div class="glass-panel p-4 h-100">
                                   <div class="d-flex align-items-center gap-3 mb-4">
                                      <div class="icon-box-red" style="color:var(--glow-red-bright)"><i class="fa-solid fa-graduation-cap"></i></div>
                                      <h4 class="fw-bold mb-0">${i18n[currentLang].headers.universities}</h4>
                                   </div>
                                   <div class="d-flex flex-column gap-4">`;

            $.each(edu, function (index, e) {
                html += `
                        <div>
                            <h5 class="fw-bold mb-1">${e.degree}</h5>
                            <p class="mb-1">
                                <a href="${e.link}" target="_blank" class="fw-semibold custom-link-hover text-primary">${e.institution}</a>
                            </p>
                            <div class="d-flex justify-content-between align-items-center text-muted small">
                                <span><i class="fa-solid fa-location-dot"></i> ${e.location}</span>
                                <span class="badge-custom m-0">${e.startDate} - ${e.endDate}</span>
                            </div>
                        </div>`;
            });

            html += `</div></div></div>
                    <div class="col-lg-6">
                       <div class="glass-panel p-4 h-100">
                           <div class="d-flex align-items-center gap-3 mb-4">
                              <div class="icon-box-red" style="color:var(--glow-red-bright)"><i class="fa-solid fa-certificate"></i></div>
                              <h4 class="fw-bold mb-0">${i18n[currentLang].headers.certificates}</h4>
                           </div>
                           <div class="d-flex flex-column gap-3">`;

            $.each(cer, function (index, c) {
                html += `
                        <div class="d-flex gap-3 align-items-start border-bottom pb-2">
                          <i class="fa-solid fa-trophy mt-1"></i>
                          <div>
                              <h5 class="mb-1 fw-bold">
                                   <a href="${c.link}" target="_blank" class="custom-link-hover text-primary">${c.title}</a>
                              </h5>
                              <div class="d-flex flex-wrap gap-2 text-muted small">
                                  <span>${c.issuer}</span>
                                  <span>•</span>
                                  <span>${c.date}</span>
                              </div>
                          </div>
                        </div>`;
            });

            html += `</div></div></div></div></div>`;

            $('#main-content').html(html);
            updateActiveNav('education');
            changelanges = false;

            var links = $('a.navlinkcustom');
            $.each(links, function(index, link) {
                $(link).removeClass('active');
            });
            $('.edu').addClass('active'); 
            
             $('#loading').fadeOut(500);
        }

        function renderAll() {
            rendersidemenu();
            renderHero();
            loadintro();
        }

        $(document).ready(function () {
            load();
        });
    </script>
</body>
</html>
